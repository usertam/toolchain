name: Test distribution compression
on:
  workflow_dispatch:
  push:
permissions:
  # Downloading the artifact of another run needs 'actions: read'
  actions: read
  contents: read
jobs:
  # TEST: make nothing but the distribution, from the artifact of the BOLT stage
  # of the run in RESTORE_RUN (branch test-main-size), and unpack it again.
  dist:
    name: Make distribution with binutils (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-24.04
        - arch: aarch64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RESTORE_RUN: 44550343964
    steps:
    - uses: actions/checkout@main
    - uses: actions/download-artifact@main
      with:
        name: bolt-${{ matrix.arch }}.tar.zst
        run-id: ${{ env.RESTORE_RUN }}
        github-token: ${{ github.token }}
    - name: Install dependencies
      run: bash ci.sh deps
    - name: Unpack artifact
      run: bash ci.sh unpack bolt-${{ matrix.arch }}.tar.zst
    - name: Build binutils
      run: bash ci.sh binutils
    - name: Strip and patch toolchain
      run: bash ci.sh fixup
    - name: Make .tar.xz distribution
      run: |
        xz --version
        time bash ci.sh dist
    - name: Unpack distribution again
      run: |
        ls -l toolchain-*.tar.xz
        xz -lvv toolchain-*.tar.xz | grep -E 'Blocks:|Memory needed|Minimum XZ|lzma2'
        mkdir again
        time tar -C again -xf toolchain-*.tar.xz
        diff -r -x .gitignore install again && echo "unpacks to the same as install"
        again/bin/clang --version
        echo 'int main(void) { return 0; }' | again/bin/clang -x c -O2 -c - -o /dev/null && echo "clang compiles"
    - uses: actions/upload-artifact@main
      with:
        name: distribution-${{ matrix.arch }}
        path: |
          toolchain-*.tar.xz
          notes.md
