name: Test distribution size
on:
  workflow_dispatch:
  push:
permissions:
  # Downloading the artifact of another run needs 'actions: read'
  actions: read
  contents: read
jobs:
  # TEST: build no LLVM. Run the BOLT stage again from the artifact of the job
  # in RESTORE of the run in RESTORE_RUN, the one that made 26.11-2, so that the
  # distribution differs from that release in nothing but what this branch
  # changes. Then compare the two on four runners at once; bench/run.sh has the
  # details.
  bolt:
    name: Optimize final LLVM with BOLT (${{ matrix.arch }})
    strategy: &matrix
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-24.04
        - arch: aarch64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RESTORE: final
      RESTORE_RUN: 44339891822
    steps:
    - uses: actions/checkout@main
    - name: Free disk space
      run: |
        sudo rm -rf \
          /usr/local/lib/android \
          /usr/local/.ghcup /opt/ghc \
          /usr/share/dotnet \
          /usr/share/swift \
          /opt/hostedtoolcache/CodeQL \
          /usr/lib/jvm \
          /usr/local/share/powershell \
          "$AGENT_TOOLSDIRECTORY"
        sudo docker system prune -af
        df -h /
    - name: Install dependencies
      run: bash ci.sh deps
    - uses: actions/download-artifact@main
      with:
        name: ${{ env.RESTORE }}-${{ matrix.arch }}.tar.zst
        run-id: ${{ env.RESTORE_RUN }}
        github-token: ${{ github.token }}
    - name: Unpack artifact
      run: bash ci.sh unpack ${{ env.RESTORE }}-${{ matrix.arch }}.tar.zst
    - name: Run stage
      run: bash ci.sh llvm --actions-stage ${{ github.job }}
    - name: Show clang
      if: always()
      run: |
        ls -l build/llvm/final/bin/clang-* install/bin/clang-* || true
        readelf -SW install/bin/clang-[0-9]* | grep -E '\.text|\.eh_frame|\.bolt' || true
        readelf -lW install/bin/clang-[0-9]* | grep LOAD || true
    - name: Pack artifact
      if: always()
      run: bash ci.sh pack ${{ github.job }}-${{ matrix.arch }}.tar.zst
    - uses: actions/upload-artifact@main
      if: always()
      with:
        path: ${{ github.job }}-${{ matrix.arch }}.tar.zst
        archive: false

  dist:
    name: Make distribution with binutils (${{ matrix.arch }})
    needs: bolt
    if: ${{ !cancelled() }}
    strategy: *matrix
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@main
    - uses: actions/download-artifact@main
      with:
        name: bolt-${{ matrix.arch }}.tar.zst
    - name: Install dependencies
      run: bash ci.sh deps
    - name: Unpack artifact
      run: bash ci.sh unpack bolt-${{ matrix.arch }}.tar.zst
    - name: Build binutils
      run: bash ci.sh binutils
    - name: Strip and patch toolchain
      run: bash ci.sh fixup
    - name: Make .tar.xz distribution
      run: bash ci.sh dist
    - name: Show distribution
      run: |
        ls -l toolchain-*.tar.xz install/bin/clang-* install/lib/libclang.so*
        cat notes.md
    - uses: actions/upload-artifact@main
      with:
        name: distribution-${{ matrix.arch }}
        path: |
          toolchain-*.tar.xz
          notes.md

  bench:
    name: Compare with 26.11-2 (${{ matrix.arch }}, ${{ matrix.sample }})
    needs: dist
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        sample: [1, 2, 3, 4]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
    - uses: actions/checkout@main
    - name: Install dependencies
      run: bash ci.sh deps
    - uses: actions/download-artifact@main
      with:
        name: distribution-${{ matrix.arch }}
    - name: Unpack distribution
      run: |
        mkdir -p bench-work/tc/candidate
        tar -C bench-work/tc/candidate -xf toolchain-${{ matrix.arch }}.tar.xz
    - name: Benchmark
      run: bash bench/run.sh 26.11-2 candidate
    - uses: actions/upload-artifact@main
      if: always()
      with:
        name: bench-${{ matrix.arch }}-${{ matrix.sample }}
        path: bench-work/log
