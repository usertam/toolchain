name: Benchmark the static toolchain
on:
  workflow_dispatch:
  push:
permissions:
  # Downloading the artifact of another run needs 'actions: read'
  actions: read
  contents: read
jobs:
  # TEST: build nothing. Compare the static distribution that the run in
  # STATIC_RUN made on branch test-static with release 26.11-5, which differs
  # from it in how it is linked and in 22 commits of LLVM, on four runners per
  # arch at once; bench/run.sh has the details.
  bench:
    name: Compare static with release (${{ matrix.arch }}, ${{ matrix.sample }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        sample: [1, 2, 3, 4]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      STATIC_RUN: 45463826707
      # The mimalloc of the static clang asks for transparent huge pages, the
      # malloc of the release does not: this run is without them. The release
      # has no mimalloc, so the variable changes nothing for it.
      MIMALLOC_ALLOW_THP: 0
    steps:
    - uses: actions/checkout@main
    - name: Install dependencies
      run: bash ci.sh deps
    - uses: actions/download-artifact@main
      with:
        name: distribution-${{ matrix.arch }}
        path: dist
        run-id: ${{ env.STATIC_RUN }}
        github-token: ${{ github.token }}
    - name: Unpack the static distribution
      run: |
        sha256sum dist/toolchain-${{ matrix.arch }}.tar.xz
        mkdir -p bench-work/tc/static
        tar -C bench-work/tc/static -xf dist/toolchain-${{ matrix.arch }}.tar.xz
    # Its clang is made for hosts with glibc, like this one: see that it finds
    # the headers, the startup files and the libraries of the host by itself
    - name: Link and run programs with the static distribution
      run: |
        t=$PWD/bench-work/tc/static/bin
        file "$t"/clang-24 "$t"/lld "$t"/ld | cut -c1-160
        "$t"/clang --version
        cd "$(mktemp -d)"
        printf '#include <stdio.h>\nint main(void) { puts("hello"); return 0; }\n' > hello.c
        cat > throw.cpp <<'EOF'
        #include <cstdio>
        #include <stdexcept>
        #include <thread>
        #include <vector>
        int main() {
            std::vector<std::thread> threads;
            int caught = 0;
            for (int i = 0; i < 8; i++)
                threads.emplace_back([&] {
                    try {
                        throw std::runtime_error("thrown");
                    } catch (const std::exception &) {
                        __atomic_add_fetch(&caught, 1, __ATOMIC_SEQ_CST);
                    }
                });
            for (auto &thread : threads)
                thread.join();
            std::printf("caught %d of 8\n", caught);
            return caught != 8;
        }
        EOF
        # check <what> <compiler> <flags and source>: a failure is for the log,
        # the benchmark runs all the same
        check() {
          if "$t/$2" -O2 "${@:3}" -o program && ./program; then
            echo "$1: fine"
          else
            echo "::warning::$1: failed"
          fi
        }
        check 'C, GNU ld' clang -fuse-ld=bfd hello.c
        check 'C, lld' clang -fuse-ld=lld hello.c
        check 'C++, GNU ld' clang++ -fuse-ld=bfd -pthread throw.cpp
        check 'C++, lld' clang++ -fuse-ld=lld -pthread throw.cpp
        check 'C++, lld, ThinLTO' clang++ -fuse-ld=lld -flto=thin -pthread throw.cpp
    - name: Benchmark
      run: bash bench/run.sh 26.11-5 static
    - uses: actions/upload-artifact@main
      if: always()
      with:
        name: bench-${{ matrix.arch }}-${{ matrix.sample }}
        path: bench-work/log
