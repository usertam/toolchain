name: Build distribution
on:
  workflow_dispatch:
  push:
  schedule:
  - cron: '0 0 * * MON'
permissions:
  # Downloading the artifact of another run needs 'actions: read'
  actions: read
  contents: read
jobs:
  # TEST: skip every stage before BOLT, and continue from the artifact of the
  # job in RESTORE of the earlier run in RESTORE_RUN
  bolt:
    name: Optimize final LLVM with BOLT (${{ matrix.arch }})
    strategy: &matrix
      fail-fast: false
      matrix:
        include:
        - arch: aarch64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RESTORE: final
      RESTORE_RUN: 43794549867
    steps:
    - uses: actions/checkout@main
    - name: Free disk space
      run: |
        sudo rm -rf \
          /usr/local/lib/android \
          /usr/local/.ghcup /opt/ghc \
          /usr/share/dotnet \
          /usr/share/swift \
          /opt/hostedtoolcache/CodeQL \
          /usr/lib/jvm \
          /usr/local/share/powershell \
          "$AGENT_TOOLSDIRECTORY"
        sudo docker system prune -af
        df -h /
    - uses: actions/download-artifact@main
      if: env.RESTORE
      with:
        name: ${{ env.RESTORE }}-${{ matrix.arch }}
        run-id: ${{ env.RESTORE_RUN }}
        github-token: ${{ github.token }}
    - name: Install dependencies
      run: bash ci.sh deps
    - name: Fetch LLVM
      if: env.LLVM_COMMIT
      run: bash ci.sh fetch "$LLVM_COMMIT"
    - name: Unpack artifact
      if: env.RESTORE
      run: bash ci.sh unpack
    - name: Build
      run: bash ci.sh llvm --actions-stage ${{ github.job }}
    - name: Pack artifact
      if: always()
      run: bash ci.sh pack
    - uses: actions/upload-artifact@main
      if: always()
      with:
        name: ${{ github.job }}-${{ matrix.arch }}
        path: artifact.tar

  dist:
    name: Make distribution with binutils (${{ matrix.arch }})
    needs: bolt
    strategy: *matrix
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@main
    - uses: actions/download-artifact@main
      with:
        name: bolt-${{ matrix.arch }}
    - name: Install dependencies
      run: bash ci.sh deps
    - name: Unpack artifact
      run: bash ci.sh unpack
    - name: Build binutils
      run: bash ci.sh binutils
    - name: Strip and patch toolchain
      run: bash ci.sh fixup
    - name: Make .tar.xz distribution
      run: bash ci.sh dist
    - uses: actions/upload-artifact@main
      with:
        name: distribution-${{ matrix.arch }}
        path: |
          toolchain-*.tar.xz
          notes.md
    - name: Pack artifact
      if: failure()
      run: bash ci.sh pack
    - uses: actions/upload-artifact@main
      if: failure()
      with:
        name: dist-${{ matrix.arch }}
        path: artifact.tar

  # Publish every arch in one release from one job, so they share its tag
  release:
    name: Publish release
    needs: dist
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
    - uses: actions/checkout@main
    - uses: actions/download-artifact@main
      with:
        pattern: distribution-*
    - name: Publish release
      run: bash ci.sh release
      env:
        GH_TOKEN: ${{ github.token }}
