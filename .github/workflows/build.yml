name: Build distribution
on:
  workflow_dispatch:
  push:
  schedule:
  - cron: '0 0 * * MON'
permissions:
  contents: read
jobs:
  # Pick one LLVM commit up front, so that every arch builds the same sources
  setup:
    name: Pick LLVM commit
    runs-on: ubuntu-latest
    outputs:
      llvm-commit: ${{ steps.llvm.outputs.commit }}
    steps:
    - id: llvm
      run: echo "commit=$(git ls-remote https://github.com/llvm/llvm-project.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

  # Each LLVM stage is a job named after the stage it passes to '--actions-stage',
  # continuing from the artifact of the job in RESTORE
  bootstrap:
    name: Build bootstrap LLVM (${{ matrix.arch }})
    needs: setup
    strategy: &matrix
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-24.04
        - arch: aarch64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      LLVM_COMMIT: ${{ needs.setup.outputs.llvm-commit }}
    steps: &stage
    - uses: actions/checkout@main
    - uses: actions/download-artifact@main
      if: env.RESTORE
      with:
        name: ${{ env.RESTORE }}-${{ matrix.arch }}
    - name: Install dependencies
      run: bash ci.sh deps
    - name: Fetch LLVM
      if: env.LLVM_COMMIT
      run: bash ci.sh fetch "$LLVM_COMMIT"
    - name: Unpack artifact
      if: env.RESTORE
      run: bash ci.sh unpack
    - name: Build
      run: bash ci.sh llvm --actions-stage ${{ github.job }}
    - name: Pack artifact
      if: always()
      run: bash ci.sh pack
    - uses: actions/upload-artifact@main
      if: always()
      with:
        name: ${{ github.job }}-${{ matrix.arch }}
        path: artifact.tar

  instrumented:
    name: Build instrumented LLVM (${{ matrix.arch }})
    needs: bootstrap
    strategy: *matrix
    runs-on: ${{ matrix.runner }}
    env:
      RESTORE: bootstrap
    steps: *stage

  profiling:
    name: Profile instrumented LLVM (${{ matrix.arch }})
    needs: instrumented
    strategy: *matrix
    runs-on: ${{ matrix.runner }}
    env:
      RESTORE: instrumented
    steps: *stage

  final:
    name: Build final LLVM (${{ matrix.arch }})
    needs: profiling
    strategy: *matrix
    runs-on: ${{ matrix.runner }}
    env:
      RESTORE: profiling
    steps: *stage

  bolt:
    name: Optimize final LLVM with BOLT (${{ matrix.arch }})
    needs: final
    strategy: *matrix
    runs-on: ${{ matrix.runner }}
    env:
      RESTORE: final
    steps: *stage

  dist:
    name: Make distribution with binutils (${{ matrix.arch }})
    needs: bolt
    strategy: *matrix
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@main
    - uses: actions/download-artifact@main
      with:
        name: bolt-${{ matrix.arch }}
    - name: Install dependencies
      run: bash ci.sh deps
    - name: Unpack artifact
      run: bash ci.sh unpack
    - name: Build binutils
      run: bash ci.sh binutils
    - name: Strip and patch toolchain
      run: bash ci.sh fixup
    - name: Make .tar.xz distribution
      run: bash ci.sh dist
    - uses: actions/upload-artifact@main
      with:
        name: distribution-${{ matrix.arch }}
        path: |
          toolchain-*.tar.xz
          notes.md
    - name: Pack artifact
      if: failure()
      run: bash ci.sh pack
    - uses: actions/upload-artifact@main
      if: failure()
      with:
        name: dist-${{ matrix.arch }}
        path: artifact.tar

  # Publish every arch in one release from one job, so they share its tag
  release:
    name: Publish release
    needs: dist
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
    - uses: actions/checkout@main
    - uses: actions/download-artifact@main
      with:
        pattern: distribution-*
    - name: Publish release
      run: bash ci.sh release
      env:
        GH_TOKEN: ${{ github.token }}
