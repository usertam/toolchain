name: Test llvm-strip
on:
  workflow_dispatch:
  push:
permissions:
  # Downloading the artifact of another run needs 'actions: read'
  actions: read
  contents: read
jobs:
  # TEST: build nothing but binutils. Make the distribution again from the
  # artifacts of the run in RESTORE_RUN, which made release 26.11-3, now that
  # 'ci.sh fixup' strips with llvm-strip: once with the clang of that run, where
  # llvm-bolt had --use-gnu-stack ("gnustack"), and once with llvm-bolt run
  # again without it, so that it moves the program header table ("phdr").
  # Then compare with the release, and build a kernel; bench/strip.sh has the
  # details.
  dist:
    name: Make distribution (${{ matrix.arch }}, ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        variant: [gnustack, phdr]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      RESTORE_RUN: 44588201295
    steps:
    - uses: actions/checkout@main
    - name: Free disk space
      run: |
        sudo rm -rf \
          /usr/local/lib/android \
          /usr/local/.ghcup /opt/ghc \
          /usr/share/dotnet \
          /usr/share/swift \
          /opt/hostedtoolcache/CodeQL \
          /usr/lib/jvm \
          /usr/local/share/powershell \
          "$AGENT_TOOLSDIRECTORY"
        sudo docker system prune -af
        df -h /
    - name: Install dependencies
      run: bash ci.sh deps
    # The clang that llvm-bolt has not been over yet
    - uses: actions/download-artifact@main
      if: matrix.variant == 'phdr'
      with:
        name: final-${{ matrix.arch }}.tar.zst
        run-id: ${{ env.RESTORE_RUN }}
        github-token: ${{ github.token }}
    - name: Unpack clang
      if: matrix.variant == 'phdr'
      run: |
        tar -I zstd -xf final-${{ matrix.arch }}.tar.zst build/llvm/final/bin/clang-24
        mkdir prebolt
        mv build/llvm/final/bin/clang-24 prebolt/
        rm -r build final-${{ matrix.arch }}.tar.zst
    - uses: actions/download-artifact@main
      with:
        name: bolt-${{ matrix.arch }}.tar.zst
        run-id: ${{ env.RESTORE_RUN }}
        github-token: ${{ github.token }}
    - name: Unpack artifact
      run: bash ci.sh unpack bolt-${{ matrix.arch }}.tar.zst
    - name: Run llvm-bolt again without --use-gnu-stack
      if: matrix.variant == 'phdr'
      run: bash bench/strip.sh bolt
    - name: Build binutils
      run: bash ci.sh binutils
    - name: Strip clang with the strip of the host
      run: bash bench/strip.sh host
    - name: Strip and patch toolchain
      run: bash ci.sh fixup
    - name: Make .tar.xz distribution
      run: bash ci.sh dist
    - name: Compare with the release
      run: bash bench/strip.sh compare
    - name: Build a kernel
      run: bash ci.sh kernel
    - uses: actions/upload-artifact@main
      if: always()
      with:
        name: distribution-${{ matrix.arch }}-${{ matrix.variant }}
        path: |
          toolchain-*.tar.xz
          notes.md
