name: Benchmark the static toolchain
on:
  workflow_dispatch:
  push:
permissions:
  # Downloading the artifact of another run needs 'actions: read'
  actions: read
  contents: read
env:
  STATIC_RUN: 45463826707
jobs:
  # TEST: build nothing. Take the static distribution that the run in
  # STATIC_RUN made on branch test-static and release 26.11-5, and see what of
  # a process keeps provjobd of the hosted runners busy, on two runners per
  # arch; bench/trigger.sh has the details.
  trigger:
    name: What keeps provjobd busy (${{ matrix.arch }}, ${{ matrix.sample }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        sample: [1, 2]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      MIMALLOC_ALLOW_THP: 0
    steps:
    - uses: actions/checkout@main
    - uses: actions/download-artifact@main
      with:
        name: distribution-${{ matrix.arch }}
        path: dist
        run-id: ${{ env.STATIC_RUN }}
        github-token: ${{ github.token }}
    - name: Unpack the static distribution
      run: |
        sha256sum dist/toolchain-${{ matrix.arch }}.tar.xz
        mkdir -p bench-work/tc/static
        tar -C bench-work/tc/static -xf dist/toolchain-${{ matrix.arch }}.tar.xz
    - name: What keeps provjobd busy
      run: bash bench/trigger.sh 26.11-5 static
