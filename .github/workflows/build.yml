name: Benchmark releases
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  # TEST: build nothing. Compare two releases with each other instead, on four
  # runners of each arch at once; bench/run.sh has the details.
  bench:
    name: Compare releases (${{ matrix.arch }}, ${{ matrix.sample }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        sample: [1, 2, 3, 4]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
    - uses: actions/checkout@main
    - name: Install dependencies
      run: bash ci.sh deps
    - name: Benchmark
      run: bash bench/run.sh 26.11-1 26.11-2
    - uses: actions/upload-artifact@main
      if: always()
      with:
        name: bench-${{ matrix.arch }}-${{ matrix.sample }}
        path: bench-work/log
