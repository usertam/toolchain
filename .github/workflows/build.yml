name: Build distribution
on:
  workflow_dispatch:
  push:
  schedule:
  - cron: '0 0 * * MON'
permissions:
  # Downloading the artifact of another run needs 'actions: read'
  actions: read
  contents: read
jobs:
  # TEST: run nothing but the BOLT stage on x86_64, eight times at once, from
  # the artifact of the job in RESTORE of the earlier run in RESTORE_RUN. What
  # each one does with its number in SAMPLE is up to ci.sh.
  bolt:
    name: Optimize final LLVM with BOLT (${{ matrix.arch }}, ${{ matrix.sample }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        sample: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    env:
      RESTORE: final
      RESTORE_RUN: 44210446880
      SAMPLE: ${{ matrix.sample }}
    steps:
    - uses: actions/checkout@main
    - name: Free disk space
      run: |
        sudo rm -rf \
          /usr/local/lib/android \
          /usr/local/.ghcup /opt/ghc \
          /usr/share/dotnet \
          /usr/share/swift \
          /opt/hostedtoolcache/CodeQL \
          /usr/lib/jvm \
          /usr/local/share/powershell \
          "$AGENT_TOOLSDIRECTORY"
        sudo docker system prune -af
        df -h /
    - uses: actions/download-artifact@main
      with:
        name: ${{ env.RESTORE }}-${{ matrix.arch }}
        run-id: ${{ env.RESTORE_RUN }}
        github-token: ${{ github.token }}
    - name: Install dependencies
      run: bash ci.sh deps
    - name: Unpack artifact
      run: bash ci.sh unpack
    - name: Build
      run: bash ci.sh llvm --actions-stage ${{ github.job }}
